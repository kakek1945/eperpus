  "Lainnya"
];

// Kategori Rekapitulasi Inventaris Buku Berdasarkan Kondisi
const REKAP_CONDITION_ROWS = [
  { key: "Baik", field: "condBaik" },
  { key: "Rusak Ringan", field: "condRusakRingan" },
  { key: "Rusak Berat", field: "condRusakBerat" },
  { key: "Hilang", field: "condHilang" }
];

// Pemetaan otomatis dari Sumber Buku ke 5 baris Rekapitulasi Inventaris Buku
function mapBookSourceToRekapCategory(rawSource) {
  const s = String(rawSource || "").trim();
  if (s === "Pembelian") return "Pembelian";
  if (s === "Hibah / Sumbangan" || s === "Bantuan Pihak lain") return "Hibah / Sumbangan";
  if (s === "Bantuan Pemerintah") return "Bantuan Pemerintah";
  if (s === "Bantuan BOS" || s === "BOS Reguler" || s === "Afirmasi" || s === "Kinerja") return "Bantuan BOS";
  return "Lainnya";
}

// Ekstrak rincian kondisi buku (Baik, Rusak Ringan, Rusak Berat, Hilang) secara konsisten
function getBookConditionBreakdown(book) {
  const total = Math.max(0, Number(book.stockTotal || 0));
  const hasExplicit =
    book.condBaik !== undefined ||
    book.condRusakRingan !== undefined ||
    book.condRusakBerat !== undefined ||
    book.condHilang !== undefined;

  if (hasExplicit) {
    const baik = Math.max(0, Number(book.condBaik || 0));
    const ringan = Math.max(0, Number(book.condRusakRingan || 0));
    const berat = Math.max(0, Number(book.condRusakBerat || 0));
    const hilang = Math.max(0, Number(book.condHilang || 0));
    return { baik, ringan, berat, hilang };
  }

  // Fallback jika buku lama hanya menyimpan string condition tunggal atau belum ada rincian
  const condStr = String(book.condition || "Baik").trim();
  if (condStr === "Rusak Ringan") return { baik: 0, ringan: total, berat: 0, hilang: 0 };
  if (condStr === "Rusak Berat") return { baik: 0, ringan: 0, berat: total, hilang: 0 };
  if (condStr === "Hilang") return { baik: 0, ringan: 0, berat: 0, hilang: total };
  return { baik: total, ringan: 0, berat: 0, hilang: 0 };
}

// Hitung Data Rekapitulasi Inventaris Buku (Berdasarkan Sumber & Berdasarkan Kondisi)
function computeInventoryRecapData() {
  const bySource = REKAP_SOURCE_ROWS.map(label => ({
    label,
    titles: 0,
    copies: 0
  }));

  const byCondition = {
    "Baik": { label: "Baik", titles: 0, copies: 0 },
    "Rusak Ringan": { label: "Rusak Ringan", titles: 0, copies: 0 },
    "Rusak Berat": { label: "Rusak Berat", titles: 0, copies: 0 },
    "Hilang": { label: "Hilang", titles: 0, copies: 0 }
  };

  state.books.forEach(book => {
    const totalCopies = Math.max(0, Number(book.stockTotal || 0));
    const mappedSrc = mapBookSourceToRekapCategory(book.bookSource);
    const srcRow = bySource.find(r => r.label === mappedSrc) || bySource[4];
    srcRow.titles += 1;
    srcRow.copies += totalCopies;

    const cond = getBookConditionBreakdown(book);
    if (cond.baik > 0) {
      byCondition["Baik"].titles += 1;
      byCondition["Baik"].copies += cond.baik;
    }
    if (cond.ringan > 0) {
      byCondition["Rusak Ringan"].titles += 1;
      byCondition["Rusak Ringan"].copies += cond.ringan;
    }
    if (cond.berat > 0) {
      byCondition["Rusak Berat"].titles += 1;
      byCondition["Rusak Berat"].copies += cond.berat;
    }
    if (cond.hilang > 0) {
      byCondition["Hilang"].titles += 1;
      byCondition["Hilang"].copies += cond.hilang;
    }
  });

  const totalSourceTitles = bySource.reduce((acc, r) => acc + r.titles, 0);
  const totalSourceCopies = bySource.reduce((acc, r) => acc + r.copies, 0);

  const conditionRows = [
    byCondition["Baik"],
    byCondition["Rusak Ringan"],
    byCondition["Rusak Berat"],
    byCondition["Hilang"]
  ];
  const totalConditionTitles = state.books.length;
  const totalConditionCopies = conditionRows.reduce((acc, r) => acc + r.copies, 0);

  return {
    bySource,
    totalSourceTitles,
    totalSourceCopies,
    conditionRows,
    totalConditionTitles,
    totalConditionCopies
  };
}

// Fungsi Auto-Resolver untuk mengekstrak Direct Image URL jika pengguna memasukkan tautan halaman ImgBB (https://ibb.co/fVTzR5H6)
async function resolveImgbbViewerUrl(url) {
  if (!url) return;
  if (url.includes("i.ibb.co") || /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(url)) {
    state.resolvedLogoUrl = url;
    return;
  }
  if (url.includes("ibb.co/")) {
    const code = url.split("/").filter(Boolean).pop();
    if (!state.resolvedLogoUrl) {
      state.resolvedLogoUrl = `https://i.ibb.co/${code}/logo.png`;
    }
    try {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
      const res = await fetch(proxyUrl);
      if (res.ok) {
        const data = await res.json();
        const html = data.contents || "";
        const match = html.match(/property=["']og:image["']\s+content=["']([^"']+)["']/i) ||
                      html.match(/content=["']([^"']+i\.ibb\.co[^"']+)["']/i);
        if (match && match[1]) {
          state.resolvedLogoUrl = match[1];
          document.querySelectorAll("img.school-logo-img").forEach(img => {
            img.src = state.resolvedLogoUrl;
          });
        }
      }
    } catch (e) {}
  }
}

function startRealtimeListeners() {
  if (IS_PREVIEW || !db) return;

  let loadedFlags = {
    principal: false,
    books: false,
    members: false,
    transactions: false
  };

  function checkHydrationComplete() {
    if (loadedFlags.principal && loadedFlags.books && loadedFlags.members && loadedFlags.transactions) {
      if (state.isHydrating) {
        state.isHydrating = false;
      }
      renderApp();
    }
  }

  unsubPrincipal = onSnapshot(doc(db, "settings", "schoolProfile"), (snap) => {
    if (snap.exists()) {
      state.principalInfo = { ...emptySchoolProfile, ...snap.data() };
    } else {
      state.principalInfo = {
        ...emptySchoolProfile,
        principalName: "Kepala Sekolah",
        greetingTitle: "Selamat Datang di Perpustakaan Digital",
        greetingMessage: "Silakan login sebagai Admin atau Kepala Sekolah untuk melengkapi sambutan dan profil perpustakaan sekolah."
      };
    }
    loadedFlags.principal = true;
    resolveImgbbViewerUrl(state.principalInfo.schoolLogo);
    checkHydrationComplete();
  }, () => {
    loadedFlags.principal = true;
    checkHydrationComplete();
  });

  unsubBooks = onSnapshot(collection(db, "books"), (snap) => {
    state.books = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedFlags.books = true;
    checkHydrationComplete();
  }, () => {
    loadedFlags.books = true;
    checkHydrationComplete();
  });

  unsubMembers = onSnapshot(collection(db, "members"), (snap) => {
    state.members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedFlags.members = true;
    checkHydrationComplete();
  }, () => {
    loadedFlags.members = true;
    checkHydrationComplete();
  });

  unsubTransactions = onSnapshot(collection(db, "transactions"), (snap) => {
    state.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loadedFlags.transactions = true;
    checkHydrationComplete();
  }, () => {
    loadedFlags.transactions = true;
    checkHydrationComplete();
  });
}

// Efek Suara Beep Saat Barcode Berhasil Dipindai
function playScannerBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1046.5, ctx.currentTime);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.12);
  } catch (e) {}
}

// Notifikasi Toast Bergaya GitHub Flash Alert
function showToast(message, type = "info") {
  const container = document.getElementById("toast-container");
  if (!container) return;

  const styles = {
    success: "bg-[#dafbe1] text-[#1a7f37] border-[#aceebb]",
    error: "bg-[#ffebe9] text-[#cf222e] border-[#ffcecb]",
    warning: "bg-[#fff8c5] text-[#9a6700] border-[#fae17d]",
    info: "bg-[#ddf4ff] text-[#0969da] border-[#b6e3ff]"
  };
  const icons = {
    success: "check-circle-2",
    error: "alert-circle",
    warning: "alert-triangle",
    info: "info"
  };

  const toast = document.createElement("div");
  toast.className = `pointer-events-auto flex items-center gap-2.5 px-3.5 py-2.5 rounded-md border shadow-md text-xs font-medium transition-all duration-300 ${styles[type] || styles.info}`;
  toast.innerHTML = `
    <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i>
    <span class="flex-1 leading-snug">${message}</span>
  `;
  container.appendChild(toast);
  if (window.lucide) window.lucide.createIcons();

  setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transform = "translateY(-6px)";
    setTimeout(() => toast.remove(), 250);
  }, 3400);
}

// Render semua elemen SVG Barcode menggunakan JsBarcode
function renderAllBarcodes() {
  if (!window.JsBarcode) return;
  document.querySelectorAll("svg.barcode-svg").forEach((svgEl) => {
    const code = svgEl.getAttribute("data-code");
    const height = parseInt(svgEl.getAttribute("data-height") || "36", 10);
    if (code) {
      try {
        window.JsBarcode(svgEl, code, {
          format: "CODE128",
          lineColor: "#1f2328",
          width: 1.6,
          height: height,
          displayValue: true,
          font: "JetBrains Mono",
          fontSize: 11,
          margin: 4
        });
      } catch (err) {}
    }
  });
}

window.handleLoginSubmit = async function(e) {
  e.preventDefault();
  const form = e.target;

  if (state.loginTab === 'admin_auth') {
    const email = form.email.value.trim();
    const password = form.password.value.trim();

    if (IS_PREVIEW) {
      if (email === "admin@sekolah.sch.id" && password === "admin123") {
        window.quickPreviewRoleLogin('admin');
      } else {
        showToast("Email atau Password Admin salah!", "error");
      }
      return;
    }

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      state.currentUser = {
        id: cred.user.uid,
        role: "admin",
        email: cred.user.email,
        memberBarcode: "ADMIN-AUTH",
        fullName: "Administrator Utama",
        department: "Admin Sistem"
      };
      state.screen = "app";
      state.activeMenu = "dashboard";
      showToast("Login Admin via Firebase Auth berhasil!", "success");
      renderApp();
    } catch (err) {
      showToast("Gagal Login Admin: Periksa Email & Password Firebase Auth Anda.", "error");
    }
  } else {
    const memberBarcode = form.memberBarcode.value.trim().toUpperCase();
    const password = form.password.value.trim();

    if (IS_PREVIEW) {
      const found = state.members.find(
        m => m.memberBarcode.toUpperCase() === memberBarcode && m.password === password
      );
      if (!found) {
        showToast("ID Barcode / NIP / NIS atau Password tidak ditemukan!", "error");
        return;
      }
      if (found.status !== "active") {
        showToast("Akun Anda sedang dinonaktifkan sementara.", "warning");
        return;
      }
      const userRole = found.role || "siswa";
      state.currentUser = {
        id: found.id,
        role: userRole,
        memberBarcode: found.memberBarcode,
        fullName: found.fullName,
        department: found.department,
        phone: found.phone
      };
      state.screen = "app";
      state.activeMenu = isStaffRole(userRole) ? "dashboard" : "member_home";
      showToast(`Selamat datang, ${found.fullName} (${ROLE_CONFIG[userRole]?.label || userRole})!`, "success");
      renderApp();
      return;
    }

    try {
      const q = query(
        collection(db, "members"),
        where("memberBarcode", "==", memberBarcode),
        where("password", "==", password)
      );
      const snap = await getDocs(q);
      if (snap.empty) {
        showToast("ID Pengguna / Barcode atau Password salah!", "error");
        return;
      }
      const memberDoc = snap.docs[0];
      const memberData = memberDoc.data();
      if (memberData.status !== "active") {
        showToast("Status akun sedang ditangguhkan.", "warning");
        return;
      }
      const userRole = memberData.role || "siswa";
      state.currentUser = {
        id: memberDoc.id,
        role: userRole,
        memberBarcode: memberData.memberBarcode,
        fullName: memberData.fullName,
        department: memberData.department,
        phone: memberData.phone
      };
      state.screen = "app";
      state.activeMenu = isStaffRole(userRole) ? "dashboard" : "member_home";
      showToast(`Selamat datang, ${memberData.fullName}!`, "success");
      renderApp();
    } catch (err) {
      showToast("Terjadi kesalahan saat memverifikasi akun di Firestore.", "error");
    }
  }
};

window.handleBookFileSelect = function(e) {
  const file = e.target.files?.[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = window.XLSX.read(data, { type: "array" });
      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      const rawRows = window.XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

      if (!rawRows || rawRows.length === 0) {
        showToast("File kosong atau format tidak dikenali.", "warning");
        return;
      }

      const parsed = [];
      rawRows.forEach((row) => {
        const title = String(row["Judul"] || row["Judul Buku"] || row["title"] || "").trim();
        if (!title) return;

        const rawBarcode = String(row["Barcode"] || row["Kode Barcode"] || row["ISBN"] || row["barcode"] || "").trim().toUpperCase();
        const barcode = rawBarcode || ("BK-" + Math.floor(100000 + Math.random() * 900000));
        const author = String(row["Penulis"] || row["Pengarang"] || row["author"] || "-").trim();
        const publisher = String(row["Penerbit"] || row["publisher"] || "-").trim();
        const year = String(row["Tahun"] || row["year"] || "2025").trim();
        const category = String(row["Kategori"] || row["category"] || "Teknologi").trim();

        let rawSource = String(row["Sumber Buku"] || row["Sumber"] || row["bookSource"] || "BOS Reguler").trim();
        const matchedSource = BOOK_SOURCES.find(s => s.toLowerCase() === rawSource.toLowerCase()) || "BOS Reguler";

        const shelf = String(row["Lokasi Rak"] || row["Rak"] || row["shelf"] || "Rak A-01").trim();
        const stockTotal = Math.max(1, parseInt(row["Total Stok"] || row["Stok"] || row["stockTotal"] || 5, 10) || 5);

        const condRingan = Math.max(0, parseInt(row["Rusak Ringan"] || row["condRusakRingan"] || 0, 10) || 0);
        const condBerat = Math.max(0, parseInt(row["Rusak Berat"] || row["condRusakBerat"] || 0, 10) || 0);
        const condHilang = Math.max(0, parseInt(row["Hilang"] || row["condHilang"] || 0, 10) || 0);
        const defaultBaik = Math.max(0, stockTotal - (condRingan + condBerat + condHilang));
        const condBaik = row["Kondisi Baik"] !== undefined && row["Kondisi Baik"] !== ""
          ? Math.max(0, parseInt(row["Kondisi Baik"], 10) || 0)
          : defaultBaik;

        parsed.push({
          barcode,
          title,
          author,
          publisher,
          year,
          category,
          bookSource: matchedSource,
          shelf,
          stockTotal,
          stockAvailable: stockTotal,
          condBaik,
          condRusakRingan: condRingan,
          condRusakBerat: condBerat,
          condHilang,
          createdAt: new Date().toISOString().split("T")[0]
        });
      });

      state.pendingImportBooks = parsed;
      const previewBox = document.getElementById("book-import-preview");
      const countEl = document.getElementById("book-import-count");
      const tableWrap = document.getElementById("book-import-table-wrap");
      const btnSubmit = document.getElementById("btn-confirm-book-import");

      if (parsed.length === 0) {
        showToast("Tidak ditemukan baris buku yang memiliki kolom 'Judul'.", "warning");
        return;
      }

      previewBox.classList.remove("hidden");
      countEl.textContent = `${parsed.length} koleksi buku siap diimpor`;
      btnSubmit.disabled = false;
      btnSubmit.classList.remove("opacity-50", "cursor-not-allowed");

      tableWrap.innerHTML = `
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-[#f6f8fa] border-b border-[#d0d7de] text-[#656d76]">
              <th class="py-2 px-3">Barcode</th>
              <th class="py-2 px-3">Judul Buku</th>
              <th class="py-2 px-3">Sumber Buku</th>
              <th class="py-2 px-3">Rak</th>
              <th class="py-2 px-3">Stok</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-[#d0d7de]">
            ${parsed.slice(0, 25).map(item => `
              <tr>
                <td class="py-1.5 px-3 font-mono font-semibold text-[#0969da]">${item.barcode}</td>
                <td class="py-1.5 px-3 font-medium text-[#1f2328]">${item.title}</td>
                <td class="py-1.5 px-3"><span class="gh-label ${getSourceBadgeStyle(item.bookSource)}">${item.bookSource}</span></td>
                <td class="py-1.5 px-3">${item.shelf}</td>
                <td class="py-1.5 px-3 font-mono">${item.stockTotal}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      showToast("Gagal membaca file Excel/CSV. Pastikan format sesuai template.", "error");
    }
  };
  reader.readAsArrayBuffer(file);
};

window.processBookImportSubmit = async function() {
  const items = state.pendingImportBooks || [];
  if (items.length === 0) return;

  if (IS_PREVIEW) {
    let added = 0;
    let updated = 0;
    items.forEach(item => {
      const existing = state.books.find(b => b.barcode.toUpperCase() === item.barcode.toUpperCase());
      if (existing) {
        const borrowed = Math.max(0, (existing.stockTotal || 0) - (existing.stockAvailable || 0));
        Object.assign(existing, {
          ...item,
          stockAvailable: Math.max(0, item.stockTotal - borrowed)
        });
        updated++;
      } else {
        state.books.unshift({ id: "book-imp-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6), ...item });
        added++;
      }
    });
    state.pendingImportBooks = [];
    savePreviewStateToCache();
    window.closeAppModal();
    showToast(`Impor selesai: ${added} buku baru ditambahkan, ${updated} diperbarui!`, "success");
    renderApp();
    return;
  }

  try {
    for (const item of items) {
      const existing = state.books.find(b => b.barcode.toUpperCase() === item.barcode.toUpperCase());
      if (existing) {
        const borrowed = Math.max(0, (existing.stockTotal || 0) - (existing.stockAvailable || 0));
        await updateDoc(doc(db, "books", existing.id), {
          ...item,
          stockAvailable: Math.max(0, item.stockTotal - borrowed)
        });
      } else {
        await addDoc(collection(db, "books"), item);
      }
    }
    state.pendingImportBooks = [];
    window.closeAppModal();
    showToast(`Berhasil mengimpor ${items.length} buku ke Firestore!`, "success");
  } catch (err) {
    showToast("Terjadi kesalahan saat menyimpan sebagian buku ke Firestore.", "error");
  }
};

function normalizeRoleInput(rawRole) {
  const clean = String(rawRole || "siswa").trim().toLowerCase().replace(/\s+/g, "_");
  if (ROLE_CONFIG[clean]) return clean;
  if (clean.includes("kepala_sekolah") || clean.includes("kepsek")) return "kepala_sekolah";
  if (clean.includes("admin")) return "admin";
  if (clean.includes("kepala_perpustakaan") || clean.includes("kaperpus")) return "kepala_perpustakaan";
  if (clean.includes("pustakawan") || clean.includes("petugas")) return "pustakawan";
  if (clean.includes("guru") || clean.includes("pengajar")) return "guru";
  return "siswa";
}

window.handleMemberFileSelect = function(e) {
  const file = e.target.files?.[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = window.XLSX.read(data, { type: "array" });
      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      const rawRows = window.XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

      if (!rawRows || rawRows.length === 0) {
        showToast("File kosong atau format tidak sesuai.", "warning");
        return;
      }

      const parsed = [];
      rawRows.forEach((row) => {
        const fullName = String(row["Nama Lengkap"] || row["Nama"] || row["fullName"] || "").trim();
        if (!fullName) return;

        const role = normalizeRoleInput(row["Role"] || row["Jabatan"] || row["role"] || "siswa");
        const rawCode = String(row["ID Barcode"] || row["Barcode"] || row["NIS"] || row["NIP"] || row["memberBarcode"] || "").trim().toUpperCase();
        const memberBarcode = rawCode || ("USR-" + Math.floor(1000 + Math.random() * 9000));
        const password = String(row["Password"] || row["password"] || "123").trim() || "123";
        const department = String(row["Unit atau Kelas"] || row["Kelas"] || row["Unit"] || row["department"] || ROLE_CONFIG[role].label).trim();
        const phone = String(row["No HP"] || row["Telepon"] || row["WA"] || row["phone"] || "-").trim();
        const rawStatus = String(row["Status"] || row["status"] || "active").trim().toLowerCase();
        const status = rawStatus === "suspended" ? "suspended" : "active";

        parsed.push({
          memberBarcode,
          fullName,
          role,
          password,
          department,
          phone,
          status,
          createdAt: new Date().toISOString().split("T")[0]
        });
      });

      state.pendingImportMembers = parsed;
      const previewBox = document.getElementById("member-import-preview");
      const countEl = document.getElementById("member-import-count");
      const tableWrap = document.getElementById("member-import-table-wrap");
      const btnSubmit = document.getElementById("btn-confirm-member-import");

      if (parsed.length === 0) {
        showToast("Tidak ditemukan baris dengan kolom 'Nama Lengkap'.", "warning");
        return;
      }

      previewBox.classList.remove("hidden");
      countEl.textContent = `${parsed.length} data pengguna siap diimpor`;
      btnSubmit.disabled = false;
      btnSubmit.classList.remove("opacity-50", "cursor-not-allowed");

      tableWrap.innerHTML = `
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-[#f6f8fa] border-b border-[#d0d7de] text-[#656d76]">
              <th class="py-2 px-3">ID Barcode</th>
              <th class="py-2 px-3">Nama Lengkap</th>
              <th class="py-2 px-3">Role</th>
              <th class="py-2 px-3">Unit / Kelas</th>
              <th class="py-2 px-3">Password</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-[#d0d7de]">
            ${parsed.slice(0, 25).map(item => `
              <tr>
                <td class="py-1.5 px-3 font-mono font-semibold text-[#1f2328]">${item.memberBarcode}</td>
                <td class="py-1.5 px-3 font-medium text-[#1f2328]">${item.fullName}</td>
                <td class="py-1.5 px-3"><span class="gh-label ${ROLE_CONFIG[item.role]?.badgeClass || ''}">${ROLE_CONFIG[item.role]?.label || item.role}</span></td>
                <td class="py-1.5 px-3">${item.department}</td>
                <td class="py-1.5 px-3 font-mono">${item.password}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      showToast("Gagal membaca file Excel/CSV.", "error");
    }
  };
  reader.readAsArrayBuffer(file);
};

window.processMemberImportSubmit = async function() {
  const items = state.pendingImportMembers || [];
  if (items.length === 0) return;

  if (IS_PREVIEW) {
    let added = 0;
    let updated = 0;
    items.forEach(item => {
      const existing = state.members.find(m => m.memberBarcode.toUpperCase() === item.memberBarcode.toUpperCase());
      if (existing) {
        Object.assign(existing, item);
        updated++;
      } else {
        state.members.unshift({ id: "mem-imp-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6), ...item });
        added++;
      }
    });
    state.pendingImportMembers = [];
    savePreviewStateToCache();
    window.closeAppModal();
    showToast(`Impor selesai: ${added} user baru ditambahkan, ${updated} diperbarui!`, "success");
    renderApp();
    return;
  }

  try {
    for (const item of items) {
      const existing = state.members.find(m => m.memberBarcode.toUpperCase() === item.memberBarcode.toUpperCase());
      if (existing) {
        await updateDoc(doc(db, "members", existing.id), item);
      } else {
        await addDoc(collection(db, "members"), item);
      }
    }
    state.pendingImportMembers = [];
    window.closeAppModal();
    showToast(`Berhasil mengimpor ${items.length} data pengguna ke Firestore!`, "success");
  } catch (err) {
    showToast("Gagal menyimpan sebagian data pengguna ke Firestore.", "error");
  }
};

window.saveBookSubmit = async function(e, bookId) {
  e.preventDefault();
  const f = e.target;
  const barcode = f.barcode.value.trim().toUpperCase();

  const condBaik = Math.max(0, parseInt(f.condBaik.value, 10) || 0);
  const condRusakRingan = Math.max(0, parseInt(f.condRusakRingan.value, 10) || 0);
  const condRusakBerat = Math.max(0, parseInt(f.condRusakBerat.value, 10) || 0);
  const condHilang = Math.max(0, parseInt(f.condHilang.value, 10) || 0);
  const sumConditions = condBaik + condRusakRingan + condRusakBerat + condHilang;

  let stockTotal = parseInt(f.stockTotal.value, 10) || 1;
  if (sumConditions > 0 && sumConditions !== stockTotal) {
    stockTotal = sumConditions;
  }

  const existing = bookId ? state.books.find(b => b.id === bookId) : null;
  const borrowedCount = existing ? Math.max(0, (existing.stockTotal || 0) - (existing.stockAvailable || 0)) : 0;
  const stockAvailable = Math.max(0, stockTotal - borrowedCount);

  const payload = {
    barcode,
    title: f.title.value.trim(),
    author: f.author.value.trim(),
    publisher: f.publisher.value.trim(),
    year: f.year.value.trim(),
    category: f.category.value,
    bookSource: f.bookSource.value,
    shelf: f.shelf.value.trim(),
    stockTotal,
    stockAvailable,
    condBaik,
    condRusakRingan,
    condRusakBerat,
    condHilang,
    createdAt: existing ? existing.createdAt : new Date().toISOString().split("T")[0]
  };

  if (IS_PREVIEW) {
    if (existing) {
      Object.assign(existing, payload);
      showToast(`Buku "${payload.title}" (${payload.bookSource}) diperbarui!`, "success");
    } else {
      state.books.unshift({ id: "book-" + Date.now(), ...payload });
      showToast(`Buku baru sumber ${payload.bookSource} ditambahkan!`, "success");
    }
    savePreviewStateToCache();
    window.closeAppModal();
    renderApp();
    return;
  }

  try {
    if (bookId) {
      await updateDoc(doc(db, "books", bookId), payload);
      showToast("Data buku berhasil diperbarui di Firestore!", "success");
    } else {
      await addDoc(collection(db, "books"), payload);
      showToast("Buku baru berhasil disimpan ke Firestore!", "success");
    }
    window.closeAppModal();
  } catch (err) {
    showToast("Gagal menyimpan buku ke database.", "error");
  }
};

window.saveMemberSubmit = async function(e, memberId) {
  e.preventDefault();
  const f = e.target;
  const payload = {
    role: f.role.value,
    memberBarcode: f.memberBarcode.value.trim().toUpperCase(),
    password: f.password.value.trim(),
    fullName: f.fullName.value.trim(),
    department: f.department.value.trim(),
    phone: f.phone.value.trim(),
    status: f.status.value,
    createdAt: new Date().toISOString().split("T")[0]
  };

  if (IS_PREVIEW) {
    if (memberId) {
      const target = state.members.find(m => m.id === memberId);
      if (target) Object.assign(target, payload);
      showToast(`Data ${payload.fullName} (${ROLE_CONFIG[payload.role]?.label}) diperbarui!`, "success");
    } else {
      state.members.unshift({ id: "mem-" + Date.now(), ...payload });
      showToast(`Pengguna baru (${ROLE_CONFIG[payload.role]?.label}) ditambahkan!`, "success");
    }
    savePreviewStateToCache();
    window.closeAppModal();
    renderApp();
    return;
  }

  try {
    if (memberId) {
      await updateDoc(doc(db, "members", memberId), payload);
      showToast("Data pengguna diperbarui di Firestore!", "success");
    } else {
      await addDoc(collection(db, "members"), payload);
      showToast("Pengguna baru disimpan ke Firestore!", "success");
    }
    window.closeAppModal();
  } catch (err) {
    showToast("Gagal menyimpan data pengguna.", "error");
  }
};

window.handleBorrowSubmit = async function(e) {
  e.preventDefault();
  const memberCode = state.circulationForm.memberBarcode.trim().toUpperCase();
  const bookCode = state.circulationForm.bookBarcode.trim().toUpperCase();
  const days = parseInt(state.circulationForm.borrowDays, 10) || 7;

  const member = state.members.find(m => m.memberBarcode.toUpperCase() === memberCode);
  if (!member) {
    showToast(`Barcode Anggota/Guru/Siswa (${memberCode}) tidak ditemukan!`, "error");
    return;
  }
  if (member.status !== "active") {
    showToast(`Akun ${member.fullName} sedang ditangguhkan!`, "warning");
    return;
  }

  const book = state.books.find(b => b.barcode.toUpperCase() === bookCode);
  if (!book) {
    showToast(`Barcode Buku (${bookCode}) tidak ditemukan di katalog!`, "error");
    return;
  }
  if (book.stockAvailable <= 0) {
    showToast(`Stok buku "${book.title}" sedang habis dipinjam!`, "warning");
    return;
  }

  const today = new Date();
  const due = new Date();
  due.setDate(today.getDate() + days);

  const trxPayload = {
    trxCode: "PR-" + Math.floor(1000 + Math.random() * 9000),
    memberId: member.id,
    memberBarcode: member.memberBarcode,
    memberName: member.fullName,
    memberRole: member.role || "siswa",
    bookId: book.id,
    bookBarcode: book.barcode,
    bookTitle: book.title,
    borrowDate: today.toISOString().split("T")[0],
    dueDate: due.toISOString().split("T")[0],
    returnDate: null,
    status: "borrowed",
    fineAmount: 0
  };

  if (IS_PREVIEW) {
    book.stockAvailable = Math.max(0, book.stockAvailable - 1);
    state.transactions.unshift({ id: "trx-" + Date.now(), ...trxPayload });
    state.circulationForm.bookBarcode = "";
    savePreviewStateToCache();
    playScannerBeep();
    showToast(`Peminjaman "${book.title}" oleh ${member.fullName} berhasil!`, "success");
    renderApp();
    return;
  }

  try {
    await addDoc(collection(db, "transactions"), trxPayload);
    await updateDoc(doc(db, "books", book.id), {
      stockAvailable: Math.max(0, book.stockAvailable - 1)
    });
    state.circulationForm.bookBarcode = "";
    playScannerBeep();
    showToast("Transaksi peminjaman berhasil tercatat di Firestore!", "success");
  } catch (err) {
    showToast("Gagal memproses transaksi peminjaman.", "error");
  }
};

window.processReturnTransaction = async function(trxId) {
  const trx = state.transactions.find(t => t.id === trxId);
  if (!trx || trx.status === "returned") return;

  const todayStr = new Date().toISOString().split("T")[0];
  const dueTime = new Date(trx.dueDate).getTime();
  const nowTime = new Date(todayStr).getTime();
  const diffDays = Math.max(0, Math.ceil((nowTime - dueTime) / (1000 * 60 * 60 * 24)));
  const fine = diffDays * (parseInt(state.circulationForm.finePerDay, 10) || 1000);

  const book = state.books.find(b => b.id === trx.bookId || b.barcode === trx.bookBarcode);

  if (IS_PREVIEW) {
    trx.status = "returned";
    trx.returnDate = todayStr;
    trx.fineAmount = fine;
    if (book) book.stockAvailable = Math.min(book.stockTotal, book.stockAvailable + 1);
    savePreviewStateToCache();
    playScannerBeep();
    showToast(
      fine > 0
        ? `Buku dikembalikan. Terlambat ${diffDays} hari (Denda Rp ${fine.toLocaleString('id-ID')})`
        : `Buku "${trx.bookTitle}" telah dikembalikan tepat waktu!`,
      fine > 0 ? "warning" : "success"
    );
    renderApp();
    return;
  }

  try {
    await updateDoc(doc(db, "transactions", trx.id), {
      status: "returned",
      returnDate: todayStr,
      fineAmount: fine
    });
    if (book) {
      await updateDoc(doc(db, "books", book.id), {
        stockAvailable: Math.min(book.stockTotal, book.stockAvailable + 1)
      });
    }
    playScannerBeep();
    showToast("Pengembalian buku berhasil disimpan!", "success");
  } catch (err) {
    showToast("Gagal memproses pengembalian buku.", "error");
  }
};

window.processReturnByBookBarcode = function(scannedCode) {
  const code = scannedCode.trim().toUpperCase();
  const activeTrx = state.transactions.find(
    t => t.bookBarcode.toUpperCase() === code && t.status === "borrowed"
  );
  if (!activeTrx) {
    showToast(`Tidak ada pinjaman terbuka untuk Barcode Buku: ${code}`, "warning");
    return;
  }
  window.processReturnTransaction(activeTrx.id);
};

function getMenusByRole(role) {
  if (role === "kepala_sekolah") {
    return [
      { key: "dashboard", label: "Overview & Rekap", icon: "layout-dashboard" },
      { key: "books", label: "Katalog & Sumber", icon: "library" },
      { key: "members", label: "Data Pengguna", icon: "users" }
    ];
  }
  if (["admin", "kepala_perpustakaan", "pustakawan"].includes(role)) {
    return [
      { key: "dashboard", label: "Overview", icon: "layout-dashboard" },
      { key: "circulation", label: "Scan Sirkulasi USB", icon: "scan-barcode" },
      { key: "books", label: "Katalog & Sumber", icon: "book-marked" },
      { key: "members", label: "Pengguna (6 Role)", icon: "users" },
      { key: "transactions", label: "Log Transaksi", icon: "history" }

}

function renderActiveMenuSection() {
  switch (state.activeMenu) {

      return renderBooksSection();
    case "members":
      return renderMembersSection();
    case "transactions":
      return renderTransactionsSection();
    case "member_home":
      return renderMemberCardSection();
    case "my_loans":
      return renderMyLoansSection();
    default:
      return renderDashboardSection();
  }
}

// MENU 1: DASHBOARD / OVERVIEW (DISESUAIKAN PER ROLE)
function renderDashboardSection() {
  const role = state.currentUser?.role || "siswa";
  const totalTitles = state.books.length;
  const totalCopies = state.books.reduce((acc, b) => acc + Math.max(0, Number(b.stockTotal || 0)), 0);
  const availCopies = state.books.reduce((acc, b) => acc + Math.max(0, Number(b.stockAvailable || 0)), 0);
  const activeLoans = state.transactions.filter(t => t.status === "borrowed").length;

  const statsCardsHtml = `
    <!-- 4 Kartu Ringkasan Overview Perpustakaan Digital -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="gh-box p-4">
        <div class="text-xs text-[#656d76] flex items-center justify-between mb-1">
          <span>Total Judul Buku</span>
          <i data-lucide="book" class="w-4 h-4 text-[#0969da]"></i>
        </div>
        <div class="text-2xl font-bold text-[#1f2328] font-mono">${totalTitles}</div>
        <div class="text-[11px] text-[#656d76] mt-1">${totalCopies} total eksemplar</div>
      </div>
      <div class="gh-box p-4">
        <div class="text-xs text-[#656d76] flex items-center justify-between mb-1">
          <span>Stok Tersedia</span>
          <i data-lucide="check-circle-2" class="w-4 h-4 text-[#1f883d]"></i>
        </div>
        <div class="text-2xl font-bold text-[#1f883d] font-mono">${availCopies}</div>
        <div class="text-[11px] text-[#656d76] mt-1">Siap dipinjam di rak</div>
      </div>
      <div class="gh-box p-4">
        <div class="text-xs text-[#656d76] flex items-center justify-between mb-1">
          <span>Sedang Dipinjam</span>
          <i data-lucide="clock" class="w-4 h-4 text-[#9a6700]"></i>
        </div>
        <div class="text-2xl font-bold text-[#9a6700] font-mono">${activeLoans}</div>
        <div class="text-[11px] text-[#656d76] mt-1">Transaksi aktif</div>
      </div>
      <div class="gh-box p-4">
        <div class="text-xs text-[#656d76] flex items-center justify-between mb-1">
          <span>Total Pengguna</span>
          <i data-lucide="users" class="w-4 h-4 text-[#8250df]"></i>
        </div>
        <div class="text-2xl font-bold text-[#1f2328] font-mono">${state.members.length}</div>
        <div class="text-[11px] text-[#656d76] mt-1">Terdaftar (6 Role)</div>
      </div>
    </div>
  `;

  // Render Grafik Statistik menggunakan Chart.js (Khusus Admin, Kepsek, & Ka.Perpus)
  setTimeout(() => {
    try {
      // 1. Grafik Tren Peminjaman
      const ctxTrend = document.getElementById('chartTrendLoans');
      if (ctxTrend) {
        if (chartInstanceTrend) chartInstanceTrend.destroy();
        chartInstanceTrend = new Chart(ctxTrend, {
          type: 'line',
          data: {
            labels: ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4'],
            datasets: [{
              label: 'Jumlah Peminjaman',
              data: [12, 19, 15, activeLoans + 8],
              borderColor: '#0969da',
              backgroundColor: 'rgba(9, 105, 218, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      // 2. Grafik Batang Kategori Buku
      const ctxCat = document.getElementById('chartCategoryBooks');
      if (ctxCat) {
        if (chartInstanceCategory) chartInstanceCategory.destroy();
        const catMap = {};
        state.books.forEach(b => {
          const c = b.category || 'Umum';
          catMap[c] = (catMap[c] || 0) + Number(b.stockTotal || 1);
        });
        chartInstanceCategory = new Chart(ctxCat, {
          type: 'bar',
          data: {
            labels: Object.keys(catMap),
            datasets: [{
              label: 'Eksemplar',
              data: Object.values(catMap),
              backgroundColor: '#1f883d'
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      // 3. Grafik Batang Kondisi Buku
      const ctxCond = document.getElementById('chartConditionBooks');
      if (ctxCond) {
        if (chartInstanceCondition) chartInstanceCondition.destroy();
        let baik = 0, ringan = 0, berat = 0, hilang = 0;
        state.books.forEach(b => {
          const c = getBookConditionBreakdown(b);
          baik += c.baik;
          ringan += c.ringan;
          berat += c.berat;
          hilang += c.hilang;
        });
        chartInstanceCondition = new Chart(ctxCond, {
          type: 'bar',
          data: {
            labels: ['Baik', 'Rusak Ringan', 'Rusak Berat', 'Hilang'],
            datasets: [{
              label: 'Jumlah Buku',
              data: [baik, ringan, berat, hilang],
              backgroundColor: ['#1f883d', '#9a6700', '#cf222e', '#656d76']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    } catch (e) {}
  }, 100);

  const analyticsChartsHtml = `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="gh-box p-4 flex flex-col">
        <h3 class="text-xs font-bold uppercase tracking-wider text-[#1f2328] mb-3 flex items-center gap-1.5">

          <span>Tren Peminjaman Bulanan</span>
        </h3>
        <div class="relative h-56 flex-1"><canvas id="chartTrendLoans"></canvas></div>
      </div>
      <div class="gh-box p-4 flex flex-col">
        <h3 class="text-xs font-bold uppercase tracking-wider text-[#1f2328] mb-3 flex items-center gap-1.5">
          <i data-lucide="bar-chart-2" class="w-3.5 h-3.5 text-[#1f883d]"></i>
          <span>Buku Berdasarkan Kategori</span>
        </h3>
        <div class="relative h-56 flex-1"><canvas id="chartCategoryBooks"></canvas></div>
      </div>
      <div class="gh-box p-4 flex flex-col">
        <h3 class="text-xs font-bold uppercase tracking-wider text-[#1f2328] mb-3 flex items-center gap-1.5">
          <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-[#cf222e]"></i>
          <span>Kondisi Fisik Buku</span>
        </h3>
        <div class="relative h-56 flex-1"><canvas id="chartConditionBooks"></canvas></div>
      </div>
    </div>
  `;

  // KEPALA SEKOLAH
  if (role === "kepala_sekolah") {
    return `
      <div class="space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#d0d7de] pb-4">
          <div>
            <h1 class="text-lg font-bold text-[#1f2328]">Overview Perpustakaan & Grafik Analitik</h1>
            <p class="text-xs text-[#656d76]">Monitoring statistik eksekutif, tren peminjaman, dan Rekapitulasi Inventaris Buku.</p>
          </div>
          <button onclick="window.openEditPrincipalModal()" class="gh-btn">
            <i data-lucide="pencil" class="w-3.5 h-3.5 text-[#0969da]"></i>
            <span>Edit Sambutan Kepala Sekolah</span>
          </button>
        </div>

        ${statsCardsHtml}
        ${analyticsChartsHtml}
        ${renderInventoryRecapBlock()}
      </div>
    `;
  }

  // KEPALA PERPUSTAKAAN & ADMIN
  if (["admin", "kepala_perpustakaan"].includes(role)) {

function renderBooksSection() {
  const role = state.currentUser?.role || "siswa";
  const canEdit = canManageBookFiles(role);

  const filtered = state.books.filter(b => {
    const q = state.searchQuery.trim().toLowerCase();
    const matchQ = !q ||
      (b.title || "").toLowerCase().includes(q) ||
      (b.author || "").toLowerCase().includes(q) ||
      (b.barcode || "").toLowerCase().includes(q);

    return matchQ && matchSrc;

  return `

              <i data-lucide="download" class="w-3.5 h-3.5 text-[#656d76]"></i>
              <span>Download</span>
            </button>
            <button onclick="window.openBookModal()" class="gh-btn gh-btn-primary">

              <span>Tambah Buku</span>

                  <td class="py-3 px-4">
                    <div class="font-semibold text-[#1f2328]">${t.memberName}</div>
                    <div class="font-mono text-[#656d76]">${t.memberBarcode}</div>
                  </td>
                  <td class="py-3 px-4">
                    <div class="font-semibold text-[#1f2328]">${t.bookTitle}</div>
                    <div class="font-mono text-[#656d76]">${t.bookBarcode}</div>
                  </td>
                  <td class="py-3 px-4 text-[#656d76]">
                    Pinjam: ${t.borrowDate}<br/>
                    Tempo: <strong class="text-[#1f2328]">${t.dueDate}</strong>
                  </td>
                  <td class="py-3 px-4">
                    <span class="gh-label ${t.status === 'returned' ? 'bg-[#dafbe1] text-[#1a7f37] border-[#aceebb]' : 'bg-[#fff8c5] text-[#9a6700] border-[#fae17d]'}">
                      ${t.status === 'returned' ? `Dikembalikan (${t.returnDate || '-'})` : 'Sedang Dipinjam'}
                    </span>
                    ${Number(t.fineAmount) > 0 ? `<div class="text-[11px] font-semibold text-[#cf222e] mt-1">Denda: Rp ${Number(t.fineAmount).toLocaleString('id-ID')}</div>` : ''}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderMemberCardSection() {
  const u = state.currentUser;
  const rCfg = ROLE_CONFIG[u.role] || ROLE_CONFIG.siswa;
  const logoSrc = getActiveSchoolLogo();

  return `
    <div class="max-w-xl mx-auto space-y-5">
      <div class="flex items-center justify-between border-b border-[#d0d7de] pb-3">
        <div>
          <h1 class="text-lg font-bold text-[#1f2328]">Kartu Anggota Perpustakaan Digital</h1>
          <p class="text-xs text-[#656d76]">Gunakan barcode di bawah ini untuk dipindai dengan USB Barcode Scanner di loket sirkulasi.</p>
        </div>
        <button onclick="window.printMemberCard('${u.id}')" class="gh-btn">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i> Cetak Kartu
        </button>
      </div>

      <div class="gh-box overflow-hidden bg-white shadow-xs">
        <div class="bg-[#24292f] text-white px-5 py-4 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <img src="${logoSrc}" onerror="window.handleLogoError(this)" alt="Logo" class="school-logo-img w-8 h-8 rounded bg-white p-0.5 object-contain" />
            <span class="font-bold text-sm">${state.principalInfo.schoolName || "SMP Negeri 3 Merbau"}</span>
          </div>
          <span class="gh-label ${rCfg.badgeClass}">${rCfg.label}</span>
        </div>
        <div class="p-6 space-y-4">
          <div>
            <div class="text-[11px] uppercase tracking-wider text-[#656d76]">Nama Lengkap</div>
            <div class="text-lg font-bold text-[#1f2328]">${u.fullName}</div>
            <div class="text-xs text-[#656d76]">${u.department || rCfg.label}</div>
          </div>
          <div class="p-4 rounded-md bg-[#f6f8fa] border border-[#d0d7de] flex justify-center">
            <svg class="barcode-svg" data-code="${u.memberBarcode}" data-height="46"></svg>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderMyLoansSection() {
  const myLoans = state.transactions.filter(t => t.memberBarcode === state.currentUser?.memberBarcode);

  return `
    <div class="space-y-4">
      <div class="border-b border-[#d0d7de] pb-3">
        <h1 class="text-lg font-bold text-[#1f2328]">Pinjaman Buku Saya</h1>
        <p class="text-xs text-[#656d76]">Daftar buku yang sedang Anda pinjam beserta riwayat pengembalian.</p>
      </div>

      <div class="gh-box divide-y divide-[#d0d7de] bg-white">
        ${myLoans.length === 0 ? `
          <div class="p-10 text-center text-xs text-[#656d76]">Anda belum memiliki riwayat peminjaman buku.</div>
        ` : myLoans.map(t => `
          <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="font-bold text-sm text-[#1f2328]">${t.bookTitle}</div>
              <div class="text-xs text-[#656d76] mt-0.5">
                Barcode: <span class="font-mono">${t.bookBarcode}</span> · Pinjam: ${t.borrowDate} · Jatuh Tempo: <strong class="text-[#1f2328]">${t.dueDate}</strong>
              </div>
            </div>
            <span class="gh-label ${t.status === 'returned' ? 'bg-[#dafbe1] text-[#1a7f37] border-[#aceebb]' : 'bg-[#fff8c5] text-[#9a6700] border-[#fae17d]'} self-start sm:self-center">
              ${t.status === 'returned' ? 'Sudah Dikembalikan' : 'Sedang Dipinjam'}
            </span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderApp() {
  renderPreviewBanner();
  const container = document.getElementById("app-view");
  if (!container) return;

  // Tampilkan layar pemuatan bersih saat menunggu snapshot pertama dari Firestore agar tidak ada data dummy yang berkedip
  if (state.isHydrating) {
    container.innerHTML = `
      <div class="min-h-screen flex flex-col items-center justify-center bg-white p-6 text-center">
        <div class="w-10 h-10 rounded-full border-2 border-[#d0d7de] border-t-[#0969da] animate-spin mb-3"></div>
        <div class="text-sm font-semibold text-[#1f2328]">Memuat Data Perpustakaan...</div>
        <div class="text-xs text-[#656d76] mt-0.5">${state.principalInfo.schoolName || 'SMP Negeri 3 Merbau'}</div>
      </div>
    `;
    return;
  }

  if (state.screen === "landing") {
    container.innerHTML = renderLandingScreen();
  } else if (state.screen === "login") {
    container.innerHTML = renderLoginScreen();
  } else {
    container.innerHTML = renderAuthenticatedShell();
  }

  if (window.lucide) window.lucide.createIcons();
  renderAllBarcodes();
}

if (IS_PREVIEW) {
  initPreviewDummyData();
  resolveImgbbViewerUrl(state.principalInfo.schoolLogo);
  renderApp();
} else if (auth) {
  renderApp(); // Menampilkan loading bersih sembari menunggu Firestore
  startRealtimeListeners();
  onAuthStateChanged(auth, (user) => {
    if (user) {
      state.currentUser = {
        id: user.uid,
        role: "admin",
        email: user.email,
        memberBarcode: "ADMIN-AUTH",
        fullName: "Administrator Utama",
        department: "Admin Sistem"
      };
    }
    renderApp();
  });
}
</script>
</body>
</html>
